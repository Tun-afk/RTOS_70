<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>
  <text x="500" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Sơ đồ mạch — Project cá nhân FreeRTOS trên ESP32-S3 N16R8</text>

  <!-- ===== USB ===== -->
  <text x="20" y="318" font-size="12" fill="#444">USB-C (COM)</text>
  <text x="20" y="334" font-size="12" fill="#444">nối laptop</text>
  <rect x="88" y="345" width="32" height="50" rx="4" fill="#ddd" stroke="#555" stroke-width="1.5"/>

  <!-- ===== ESP32 block ===== -->
  <rect x="120" y="70" width="180" height="600" rx="8" fill="#e8f0fa" stroke="#1f4e79" stroke-width="2"/>
  <text x="210" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f4e79">ESP32-S3</text>
  <text x="210" y="122" font-size="13" text-anchor="middle" fill="#1f4e79">N16R8 DevKit</text>

  <g font-size="13" text-anchor="end" fill="#1f4e79">
    <text x="292" y="175">GPIO4</text>
    <text x="292" y="235">GPIO5</text>
    <text x="292" y="295">GPIO6</text>
    <text x="292" y="365">GPIO15</text>
    <text x="292" y="425">GPIO16</text>
    <text x="292" y="495">GPIO8 SDA</text>
    <text x="292" y="535">GPIO9 SCL</text>
    <text x="292" y="605">3V3</text>
    <text x="292" y="635">GND</text>
  </g>
  <g fill="#1f4e79">
    <circle cx="300" cy="170" r="3.5"/><circle cx="300" cy="230" r="3.5"/><circle cx="300" cy="290" r="3.5"/>
    <circle cx="300" cy="360" r="3.5"/><circle cx="300" cy="420" r="3.5"/>
    <circle cx="300" cy="490" r="3.5"/><circle cx="300" cy="530" r="3.5"/>
    <circle cx="300" cy="600" r="3.5"/><circle cx="300" cy="630" r="3.5"/>
  </g>

  <!-- ===== GND bus (right) ===== -->
  <line x1="940" y1="170" x2="940" y2="730" stroke="#222" stroke-width="2.5"/>
  <text x="948" y="165" font-size="13" font-weight="bold" fill="#222">GND</text>

  <!-- ===== LED rows ===== -->
  <!-- LED1 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="170" x2="380" y2="170"/>
    <polyline points="380,170 386,162 398,178 410,162 422,178 434,162 440,170"/>
    <line x1="440" y1="170" x2="500" y2="170"/>
    <line x1="522" y1="170" x2="940" y2="170"/>
    <line x1="522" y1="159" x2="522" y2="181"/>
  </g>
  <polygon points="500,159 500,181 521,170" fill="#e74c3c" stroke="#333" stroke-width="1.5"/>
  <g stroke="#e74c3c" stroke-width="1.5"><line x1="510" y1="156" x2="520" y2="146"/><line x1="517" y1="159" x2="527" y2="149"/></g>
  <text x="410" y="152" font-size="12" text-anchor="middle" fill="#333">R1 330Ω</text>
  <text x="511" y="198" font-size="12" text-anchor="middle" fill="#333">LED1 (đỏ)</text>
  <circle cx="940" cy="170" r="4" fill="#222"/>

  <!-- LED2 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="230" x2="380" y2="230"/>
    <polyline points="380,230 386,222 398,238 410,222 422,238 434,222 440,230"/>
    <line x1="440" y1="230" x2="500" y2="230"/>
    <line x1="522" y1="230" x2="940" y2="230"/>
    <line x1="522" y1="219" x2="522" y2="241"/>
  </g>
  <polygon points="500,219 500,241 521,230" fill="#27ae60" stroke="#333" stroke-width="1.5"/>
  <g stroke="#27ae60" stroke-width="1.5"><line x1="510" y1="216" x2="520" y2="206"/><line x1="517" y1="219" x2="527" y2="209"/></g>
  <text x="410" y="212" font-size="12" text-anchor="middle" fill="#333">R2 330Ω</text>
  <text x="511" y="258" font-size="12" text-anchor="middle" fill="#333">LED2 (xanh)</text>
  <circle cx="940" cy="230" r="4" fill="#222"/>

  <!-- LED3 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="290" x2="380" y2="290"/>
    <polyline points="380,290 386,282 398,298 410,282 422,298 434,282 440,290"/>
    <line x1="440" y1="290" x2="500" y2="290"/>
    <line x1="522" y1="290" x2="940" y2="290"/>
    <line x1="522" y1="279" x2="522" y2="301"/>
  </g>
  <polygon points="500,279 500,301 521,290" fill="#f1c40f" stroke="#333" stroke-width="1.5"/>
  <g stroke="#d4a017" stroke-width="1.5"><line x1="510" y1="276" x2="520" y2="266"/><line x1="517" y1="279" x2="527" y2="269"/></g>
  <text x="410" y="272" font-size="12" text-anchor="middle" fill="#333">R3 330Ω</text>
  <text x="511" y="318" font-size="12" text-anchor="middle" fill="#333">LED3 (vàng)</text>
  <circle cx="940" cy="290" r="4" fill="#222"/>

  <!-- ===== Buttons ===== -->
  <!-- BTN1 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="360" x2="476" y2="360"/>
    <line x1="544" y1="360" x2="940" y2="360"/>
    <line x1="472" y1="348" x2="548" y2="348"/>
    <line x1="510" y1="348" x2="510" y2="338"/>
    <line x1="500" y1="338" x2="520" y2="338"/>
  </g>
  <circle cx="480" cy="360" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="540" cy="360" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="590" y="352" font-size="12" fill="#333">BTN1 (Task 3)</text>
  <circle cx="940" cy="360" r="4" fill="#222"/>

  <!-- BTN2 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="420" x2="476" y2="420"/>
    <line x1="544" y1="420" x2="940" y2="420"/>
    <line x1="472" y1="408" x2="548" y2="408"/>
    <line x1="510" y1="408" x2="510" y2="398"/>
    <line x1="500" y1="398" x2="520" y2="398"/>
  </g>
  <circle cx="480" cy="420" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="540" cy="420" r="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="590" y="412" font-size="12" fill="#333">BTN2 (Task 4)</text>
  <circle cx="940" cy="420" r="4" fill="#222"/>

  <!-- ===== I2C bus ===== -->
  <line x1="300" y1="490" x2="710" y2="490" stroke="#1f6fb2" stroke-width="2.5"/>
  <line x1="300" y1="530" x2="760" y2="530" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="330" y="483" font-size="12" font-weight="bold" fill="#1f6fb2">SDA</text>
  <text x="330" y="523" font-size="12" font-weight="bold" fill="#2e8b57">SCL</text>

  <!-- OLED module -->
  <rect x="440" y="575" width="180" height="85" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="530" y="612" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">OLED 0.96" SSD1306</text>
  <text x="530" y="630" font-size="12" text-anchor="middle" fill="#444">I2C · 0x3C · Task 6</text>
  <text x="470" y="590" font-size="10" text-anchor="middle" fill="#1f6fb2">SDA</text>
  <text x="520" y="590" font-size="10" text-anchor="middle" fill="#2e8b57">SCL</text>
  <text x="480" y="654" font-size="10" text-anchor="middle" fill="#c0392b">VCC</text>
  <text x="580" y="654" font-size="10" text-anchor="middle" fill="#222">GND</text>
  <line x1="470" y1="575" x2="470" y2="490" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="520" y1="575" x2="520" y2="530" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="470" cy="490" r="4" fill="#1f6fb2"/>
  <circle cx="520" cy="530" r="4" fill="#2e8b57"/>

  <!-- GY-30 module -->
  <rect x="680" y="575" width="180" height="85" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="770" y="612" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GY-30 (BH1750)</text>
  <text x="770" y="630" font-size="12" text-anchor="middle" fill="#444">I2C · 0x23 · Task 2</text>
  <text x="710" y="590" font-size="10" text-anchor="middle" fill="#1f6fb2">SDA</text>
  <text x="760" y="590" font-size="10" text-anchor="middle" fill="#2e8b57">SCL</text>
  <text x="720" y="654" font-size="10" text-anchor="middle" fill="#c0392b">VCC</text>
  <text x="790" y="654" font-size="10" text-anchor="middle" fill="#222">GND</text>
  <text x="840" y="654" font-size="10" text-anchor="middle" fill="#222">ADDR</text>
  <line x1="710" y1="575" x2="710" y2="490" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="760" y1="575" x2="760" y2="530" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="710" cy="490" r="4" fill="#1f6fb2"/>
  <circle cx="760" cy="530" r="4" fill="#2e8b57"/>

  <!-- ===== Power rails ===== -->
  <!-- 3V3 -->
  <polyline points="300,600 330,600 330,700 720,700" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="340" y="694" font-size="13" font-weight="bold" fill="#c0392b">3V3</text>
  <line x1="480" y1="660" x2="480" y2="700" stroke="#c0392b" stroke-width="2"/>
  <line x1="720" y1="660" x2="720" y2="700" stroke="#c0392b" stroke-width="2"/>
  <circle cx="480" cy="700" r="4" fill="#c0392b"/>
  <circle cx="720" cy="700" r="4" fill="#c0392b"/>
  <!-- GND -->
  <polyline points="300,630 315,630 315,730 940,730" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="340" y="748" font-size="13" font-weight="bold" fill="#222">GND</text>
  <line x1="580" y1="660" x2="580" y2="730" stroke="#222" stroke-width="2"/>
  <line x1="790" y1="660" x2="790" y2="730" stroke="#222" stroke-width="2"/>
  <line x1="840" y1="660" x2="840" y2="730" stroke="#222" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="580" cy="730" r="4" fill="#222"/>
  <circle cx="790" cy="730" r="4" fill="#222"/>
  <circle cx="840" cy="730" r="4" fill="#222"/>
  <circle cx="940" cy="730" r="4" fill="#222"/>

  <!-- ===== Notes ===== -->
  <g font-size="12.5" fill="#333">
    <text x="40" y="782">• LED: GPIO → điện trở 330Ω → anode (chân dài); cathode (chân ngắn) → GND. Mức HIGH = sáng.</text>
    <text x="40" y="802">• Nút nhấn 4 chân: nối 2 chân chéo nhau (GPIO và GND); dùng INPUT_PULLUP nội, không cần điện trở ngoài.</text>
    <text x="40" y="822">• OLED và GY-30 dùng chung bus I2C (GPIO8/9), khác địa chỉ; module đã có sẵn điện trở kéo lên SDA/SCL.</text>
    <text x="40" y="842">• ADDR của GY-30 (nét đứt): nối GND hoặc để trống → 0x23. Mọi ngoại vi cấp 3V3 từ board, GND nối chung.</text>
    <text x="40" y="862">• Dấu chấm tròn = điểm nối dây; các đường cắt nhau không có chấm là không nối.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
