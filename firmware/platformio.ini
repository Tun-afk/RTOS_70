; Project cá nhân RTOS — ESP32-S3 N16R8 (Flash 16MB QIO + PSRAM 8MB OPI)

[env:esp32s3_n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi            ; Flash QIO + PSRAM OPI
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM
   -DARDUINO_USB_CDC_ON_BOOT=1   ; thêm vào build_flags nếu cắm cổng "USB" thay vì "COM"

monitor_speed   = 115200
; esp32_exception_decoder: giải mã lỗi crash thành dòng code
; tasklog (monitor/filter_tasklog.py): tự ghi mọi thứ Serial Monitor nhận được vào
;   ../evidence/logs/tasks_logs.txt — GHI ĐÈ mỗi lần mở monitor
monitor_filters = esp32_exception_decoder, tasklog

; Thư viện: OLED cho Task 6, cảm biến ánh sáng GY-30 (BH1750) cho Task 2
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    claws/BH1750
